# ==============================================================================
# Judge0 CE Configuration for IGNITRON 2K26 Code Relay
# ==============================================================================
# Core Configuration
SERVER_PORT=2358
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ALLOWED_LANGUAGES_NUMBERS=54,62,71,63

# Resource and Sandbox Execution Limits
CPU_TIME_LIMIT=2.0
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=5.0
MEMORY_LIMIT=128000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_CPU_TIME_LIMIT=15.0
MAX_WALL_TIME_LIMIT=30.0
MAX_MEMORY_LIMIT=512000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS_LIMIT=120
MAX_QUEUE_SIZE=200
MAX_SUBMISSION_BATCH_SIZE=20
NUMBER_OF_RUNS=1

# PostgreSQL Storage Configuration
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=Judge0DbPass2026_Secured

# Redis Cache and Message Broker
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=Judge0RedisPass2026_Secured

# Maintenance and Cleanup
SUBMISSION_CACHE_DURATION=3600
CLEAN_ISOLATE_ON_STARTUP=true

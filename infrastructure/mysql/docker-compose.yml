services:
  mysql:
    image: mysql:8.0
    container_name: ignitron-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ignitron_2k26
      MYSQL_USER: ignitron_user
      MYSQL_PASSWORD: ignitron_pass
    ports:
      - '3306:3306'
    volumes:
      - ignitron_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ignitron_mysql_data:
    driver: local

